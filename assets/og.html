<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>OG 이미지 원본</title>
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #F8F5F1;
    color: #1B1D1C;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    display: flex;
    align-items: center;
    gap: 64px;
    padding: 0 96px;
    box-sizing: border-box;
    position: relative;
  }
  body::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 20px; background: #0E7C5A;
  }
  .icon { width: 280px; height: 280px; border-radius: 62px; flex: 0 0 auto;
          box-shadow: 0 12px 40px rgba(14, 124, 90, 0.18); }
  .text { display: flex; flex-direction: column; gap: 22px; }
  .name { font-size: 104px; font-weight: 800; letter-spacing: -0.03em; line-height: 1; margin: 0; }
  .line { font-size: 40px; font-weight: 700; color: #0E7C5A; line-height: 1.3; margin: 0; letter-spacing: -0.01em; }
  .sub { font-size: 32px; color: #5E6260; line-height: 1.3; margin: 0; }
</style>
</head>
<body>
  <img class="icon" src="app-icon-1024.png" alt="">
  <div class="text">
    <p class="name">출근영어</p>
    <p class="line">직장인 AI 영어회화 앱</p>
    <p class="sub">하루 한 상황, 60초 말하기</p>
  </div>
</body>
</html>
